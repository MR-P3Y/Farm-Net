limit_req_zone $binary_remote_addr zone=farmnet_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=farmnet_auth:10m rate=5r/m;

upstream farmnet_backend {
    server farmnet_backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.farmnet.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.farmnet.example;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.farmnet.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.farmnet.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location ~ ^/api/v1/auth/(login/email|otp/request|otp/verify|refresh)$ {
        limit_req zone=farmnet_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://farmnet_backend;
        include /etc/nginx/snippets/farmnet-proxy.conf;
    }

    location / {
        limit_req zone=farmnet_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://farmnet_backend;
        include /etc/nginx/snippets/farmnet-proxy.conf;
    }
}
