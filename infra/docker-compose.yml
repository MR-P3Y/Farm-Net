name: farmnet

services:
  backend:
    build:
      context: ../backend
    container_name: farmnet_backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: farmnet_mysql
    environment:
      MYSQL_DATABASE: farmnet_db
      MYSQL_USER: farmnet_user
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-me
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: farmnet_redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped

volumes:
  mysql_data:
