name: ${COMPOSE_PROJECT_NAME:-farmnet-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:?ADMIN_BASE_URL is required}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  MEDIA_STORAGE_DIR: /srv/farmnet/media
  AUTH_DEV_OTP_ENABLED: "false"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:?TRUSTED_PROXY_HOSTS is required}
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
  SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:?SUPER_ADMIN_PHONE is required}
  SUPER_ADMIN_PASSWORD_FILE: /run/secrets/super_admin_password

x-backend-secrets: &backend-secrets
  - database_url
  - redis_url
  - jwt_secret_key
  - super_admin_password

x-backend-service: &backend-service
  image: farmnet-backend:${APP_VERSION:?APP_VERSION is required}
  build:
    context: ../backend
    target: runtime
  environment: *backend-environment
  secrets: *backend-secrets
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  mem_limit: 768m
  cpus: 1.0
  init: true
  restart: unless-stopped
  logging: *default-logging
  networks:
    - data

services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data

  migration:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *backend-service
    expose:
      - "8000"
    volumes:
      - media_data:/srv/farmnet/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - edge
      - data

  email-worker:
    <<: *backend-service
    command:
      - python
      - scripts/run_notification_worker.py
      - --channel
      - email
      - --limit
      - ${WORKER_BATCH_LIMIT:-50}
      - --poll-seconds
      - ${WORKER_POLL_SECONDS:-5}
    healthcheck: &worker-healthcheck
      test:
        - CMD
        - python
        - scripts/check_worker_health.py
        - /tmp/farmnet-worker-heartbeat
        - --max-age-seconds
        - "60"
        - --max-consecutive-failures
        - "5"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: &worker-dependencies
      migration:
        condition: service_completed_successfully

  sms-worker:
    <<: *backend-service
    command:
      - python
      - scripts/run_notification_worker.py
      - --channel
      - sms
      - --limit
      - ${WORKER_BATCH_LIMIT:-50}
      - --poll-seconds
      - ${WORKER_POLL_SECONDS:-5}
    healthcheck: *worker-healthcheck
    depends_on: *worker-dependencies

  push-worker:
    <<: *backend-service
    command:
      - python
      - scripts/run_notification_worker.py
      - --channel
      - push
      - --limit
      - ${WORKER_BATCH_LIMIT:-50}
      - --poll-seconds
      - ${WORKER_POLL_SECONDS:-5}
    healthcheck: *worker-healthcheck
    depends_on: *worker-dependencies

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      NGINX_ENVSUBST_FILTER: ^API_DOMAIN$
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      - ./nginx/farmnet.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/farmnet-proxy.conf:/etc/nginx/snippets/farmnet-proxy.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=8m
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://backend:8000/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge

secrets:
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  redis_url:
    file: ${SECRETS_DIR:-./secrets}/redis_url
  jwt_secret_key:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret_key
  super_admin_password:
    file: ${SECRETS_DIR:-./secrets}/super_admin_password
  mysql_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_password
  mysql_root_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_root_password
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password

volumes:
  mysql_data:
  redis_data:
  media_data:

networks:
  edge:
    ipam:
      config:
        - subnet: ${FARMNET_EDGE_SUBNET:-172.28.0.0/24}
  data:
    internal: true
